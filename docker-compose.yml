services:
  postgres:
    image: postgres:16-alpine
    container_name: provost-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: provost
      POSTGRES_PASSWORD: provost
      POSTGRES_DB: provost
    ports:
      - "5432:5432"
    volumes:
      - provost-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provost -d provost"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  provost-pgdata:
